<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Hogar</title>

<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">

<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--accent:#f59e0b;--green:#22c55e;--red:#ef4444;--r:18px}
:root,[data-theme=dark]{--bg:#0f0f10;--card:#1b1b1d;--card2:#26262a;--line:#2f2f34;--text:#f3f3f4;--muted:#9b9ba3;--shadow:none}
[data-theme=light]{--bg:#f3f3f6;--card:#ffffff;--card2:#ececf1;--line:#e1e1e7;--text:#151518;--muted:#6c6c75;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top .bar{display:flex;align-items:center;gap:10px}
.top h1{font-size:28px;margin:0;flex:1;letter-spacing:-.5px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;position:relative;box-shadow:var(--shadow)}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.demo{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:2px 6px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin:8px 0 4px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:9px 4px;border-radius:10px;color:var(--muted);font-weight:600;font-size:15px}
.seg button.on{background:var(--card2);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.chip .av{width:20px;height:20px;font-size:11px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.av.sm{width:26px;height:26px;font-size:12px}
.av.lg{width:64px;height:64px;font-size:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.h2{font-size:15px;color:var(--muted);font-weight:600;margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.h2 .n{background:var(--card2);border-radius:8px;padding:1px 8px;font-size:13px}
.h2.red{color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.row .em{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:22px;flex:none}
.row .tx{flex:1;min-width:0}
.row .ti{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .su{font-size:13px;color:var(--muted);margin-top:2px}
.row.done .ti{text-decoration:line-through;color:var(--muted)}
.row.over{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.row.over .su{color:var(--red)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
.check svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:#111;font-weight:700;font-size:16px}
.btn.full{width:100%}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.danger{background:color-mix(in srgb,var(--red) 16%,var(--card));color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;padding:15px 22px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:14px;color:var(--muted);font-weight:600;font-size:13px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--accent)}
.ringw{position:relative;display:grid;place-items:center}
.ringw svg{display:block}
.ringw .num{position:absolute;font-weight:600;font-size:15px;color:var(--text)}
.ringw .cnt{position:absolute;bottom:-2px;right:-2px;background:var(--card2);color:var(--muted);border-radius:8px;font-size:10px;font-weight:700;padding:0 4px;line-height:15px}
.dayhead{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:15px;padding:6px 0 2px;text-align:center}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cday{padding:4px 0;border-radius:14px;display:grid;place-items:center}
.cday.out{opacity:.35}
.cday.sel{background:var(--card)}
.cday.today .num{color:var(--green)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:18px;font-weight:700;font-size:18px;padding:10px 0}
.monthnav button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.empty .big{font-size:40px;margin-bottom:6px}
/* sheets */
#sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.shead h3{margin:0;font-size:22px;flex:1}
.shead .x{width:36px;height:36px;border-radius:50%;background:var(--card2);font-size:18px;flex:none;display:grid;place-items:center}
.shead .x.bin{color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card2))}
.sheet{touch-action:pan-y}
.sheet.drag{transition:none!important;animation:none}
.sfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:16px -18px calc(-18px - env(safe-area-inset-bottom));padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:2}
.emosel{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;background:var(--card2);text-align:left}
.emosel .big{font-size:28px}
.emosel .tx{flex:1;font-weight:600}
.dots{display:flex;gap:2px;justify-content:center;height:6px;margin-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.mfoot{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.hist{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.hist:last-child{border-bottom:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 14px;border-radius:12px;background:var(--card2);border:1.5px solid transparent;font-weight:600;font-size:15px}
.opt.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.opt.wd{width:42px;padding:10px 0;text-align:center}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:14px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:10px;background:var(--card);font-size:22px;font-weight:700}
.stepper .v{flex:1;text-align:center;font-weight:700;color:var(--accent);font-size:17px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:24px;padding:6px 0;border-radius:10px;border:1.5px solid transparent}
.emojis button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);margin:6px 0;border:1.5px solid transparent;width:100%;text-align:left}
.pp.on{border-color:var(--accent)}
.pp .nm{flex:1;font-weight:600}
.pp .ord{font-weight:800;color:var(--accent);width:20px;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);border-radius:14px;margin-top:8px;width:100%;text-align:left}
.toggle .tx{flex:1}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:13px;color:var(--muted)}
/* lists */
.lhead{display:flex;align-items:center;gap:12px}
.lhead .tx{flex:1;min-width:0}
.lhead .ti{font-weight:700;font-size:18px}
.lic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--card2);position:relative;font-size:22px}
.lic svg.pr{position:absolute;inset:-3px}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .qt{color:var(--muted);font-size:14px}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.box.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.box svg{width:16px;height:16px}
.del{color:var(--muted);font-size:18px;width:30px;height:30px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input.q{width:90px;flex:none}
.addrow .btn{flex:none;padding:0 16px}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--card2);color:var(--muted)}
.tag.acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card2))}
.tag.red{color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--card2))}
/* menu */
.mday{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.mday.today{border-color:var(--accent)}
.mday .dh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.meal{display:flex;gap:10px;padding:4px 0;font-size:15px}
.meal .mk{width:62px;color:var(--muted);font-size:13px;font-weight:700;padding-top:2px;flex:none}
.slot{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:10px;background:var(--card2);margin:4px 0;text-align:left;font-size:15px}
.slot .ck{color:var(--muted);font-size:12px;font-weight:700;width:22px}
.slot.empty{color:var(--muted)}
.agg{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.agg:last-child{border-bottom:0}
.agg .nm{flex:1;font-weight:600}
.agg .qt{font-weight:700;color:var(--accent)}
.parts{padding:0 0 10px 38px;font-size:14px;color:var(--muted)}
.parts div{padding:2px 0}
.ingrow{display:grid;grid-template-columns:1fr 72px 70px 32px;gap:6px;margin:6px 0}
.ingrow input,.ingrow select{padding:10px 8px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.swatch:disabled{opacity:.25}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .tx{flex:1;min-width:0}
.mem .nm{font-weight:600}
.mem .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.login .logo{font-size:72px;line-height:0}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login h1{font-size:40px;margin:0}
.gbtn{display:flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;padding:14px 22px;border-radius:14px;font-weight:700;font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
</style>
</head>

/* ---------------- utilidades ---------------- */
const $ = (s, r = document) => r.querySelector(s);

const pd = s => new Date(...ymd(s));
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((Date.UTC(...ymd(b)) - Date.UTC(...ymd(a))) / 864e5);

/* ---------------- almacenamiento ---------------- */
const DEL = { __del: true };
const clone = v => JSON.parse(JSON.stringify(v));

class LocalStore { // modo prueba: todo en localStorage de este dispositivo
  constructor() { this.key = 'hogar-demo-v1'; try { this.data = JSON.parse(localStorage.getItem(this.key) || '{}'); } catch { this.data = {}; } this.subs = []; }
  save() { localStorage.setItem(this.key, JSON.stringify(this.data)); }
  col(c) { return (this.data[c] ||= {}); }
  emit(c) { const v = this.col(c); this.subs.filter(s => s.c === c).forEach(s => s.cb(s.id ? (v[s.id] ? clone(v[s.id]) : null) : clone(v))); }
  watch(c, cb) { const s = { c, cb }; this.subs.push(s); queueMicrotask(() => this.emit(c)); return () => this.subs.splice(this.subs.indexOf(s), 1); }
  watchDoc(c, id, cb) { const s = { c, id, cb }; this.subs.push(s); queueMicrotask(() => this.emit(c)); return () => this.subs.splice(this.subs.indexOf(s), 1); }
  async get(c, id) { const v = this.col(c)[id]; return v ? clone(v) : null; }
  async set(c, id, v) { this.col(c)[id] = clone(v); this.save(); this.emit(c); }
  async update(c, id, patch) {
    const doc = this.col(c)[id]; if (!doc) return;
    for (const [k, v] of Object.entries(patch)) {
      const parts = k.split('.'); let o = doc;
      for (let i = 0; i < parts.length - 1; i++) o = (o[parts[i]] ||= {});
      const last = parts.at(-1);
      if (v === DEL) delete o[last]; else o[last] = v === undefined ? null : clone(v);
    }
    this.save(); this.emit(c);
  }
  async del(c, id) { delete this.col(c)[id]; this.save(); this.emit(c); }
  wipe() { localStorage.removeItem(this.key); localStorage.removeItem('hogar-demo-user'); }
}

class FireStore { // Firebase (Auth con Google + Firestore)
  async init(cfg) {
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [app, auth, fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    this.fs = fs; this.A = auth;
    this.app = app.initializeApp(cfg);
    try { this.db = fs.initializeFirestore(this.app, { ignoreUndefinedProperties: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
    catch { this.db = fs.getFirestore(this.app); }
    this.auth = auth.getAuth(this.app);
    if (sessionStorage.getItem('hogar-redirect')) { sessionStorage.removeItem('hogar-redirect'); try { await auth.getRedirectResult(this.auth); } catch (e) { console.warn(e); } }
  }
  onAuth(cb) { this.A.onAuthStateChanged(this.auth, cb); }
  async login() {
    const p = new this.A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    try { await this.A.signInWithPopup(this.auth, p); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'].includes(e.code)) { sessionStorage.setItem('hogar-redirect', '1'); await this.A.signInWithRedirect(this.auth, p); }
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') throw e;
    }
  }
  logout() { return this.A.signOut(this.auth); }
  ref(c, id) { return this.fs.doc(this.db, c, id); }
  watch(c, cb, where) {
    let q = this.fs.collection(this.db, c);
    if (where) q = this.fs.query(q, this.fs.where(...where));
    return this.fs.onSnapshot(q, snap => { const o = {}; snap.forEach(d => (o[d.id] = d.data())); cb(o); }, e => console.error(c, e));
  }
  watchDoc(c, id, cb, meta) { return this.fs.onSnapshot(this.ref(c, id), { includeMetadataChanges: !!meta }, d => cb(d.exists() ? d.data() : null, d.metadata.fromCache), e => { console.error(c, e); cb(null, false); }); }
  async get(c, id) { const d = await this.fs.getDoc(this.ref(c, id)); return d.exists() ? d.data() : null; }
  set(c, id, v) { return this.fs.setDoc(this.ref(c, id), v); }
  update(c, id, patch) { const p = {}; for (const [k, v] of Object.entries(patch)) p[k] = v === DEL ? this.fs.deleteField() : v; return this.fs.updateDoc(this.ref(c, id), p); }
  del(c, id) { return this.fs.deleteDoc(this.ref(c, id)); }
}

/* =====================================================================
   MOTOR DE TAREAS
   - Fijas (daily/weekly/monthly/yearly): fechas calculadas desde "start".
   - ondone: el turno pasa al siguiente en cuanto se termina.
   - afterdone: vuelve X días después de terminarla.
   Rotación: orden fijo de personas. Si alguien hace el turno de otro,
   el turno sigue siendo del otro y a quien lo hizo se le salta su
   próximo turno (crédito).
   ===================================================================== */
const FIXED = ['daily', 'weekly', 'monthly', 'yearly'];
let CI = {}, MEMO = {};
function indexComps() { CI = {}; for (const [id, c] of Object.entries(S.completions)) (CI[c.taskId] ||= []).push({ id, ...c }); MEMO = {}; }
const activePeople = t => (t.people || []).filter(u => S.users[u]?.status === 'approved');

const isWin = t => t.mode === 'window' && (t.type === 'weekly' || t.type === 'monthly');
function occEnd(t, d) {
  if (!isWin(t)) return d;
  const N = Math.max(1, t.every || 1);
  if (t.type === 'weekly') return addDays(d, 7 * N - 1);
  const [y, m] = ymd(d); return ds(new Date(y, m + N, 0));
}
function* occIter(t) {
  const s = t.start || today(), N = Math.max(1, t.every || 1);
  if (isWin(t)) {
    if (t.type === 'weekly') { let m = mondayOf(s); for (;;) { yield m; m = addDays(m, 7 * N); } }
    let [y, mo] = ymd(s); for (;;) { yield ds(new Date(y, mo, 1)); mo += N; y += Math.floor(mo / 12); mo %= 12; }
  }
  if (t.type === 'daily') { let d = s; for (;;) { yield d; d = addDays(d, N); } }
  if (t.type === 'weekly') {
    const wds = [...(t.weekdays || [])].sort((a, b) => a - b); if (!wds.length) return;
    let m = mondayOf(s); for (;;) { for (const w of wds) { const d = addDays(m, w); if (d >= s) yield d; } m = addDays(m, 7 * N); }
  }
  if (t.type === 'monthly') {
    let [y, mo] = ymd(s);
    for (;;) { const d = ds(new Date(y, mo, Math.min(t.monthDay || 1, dim(y, mo)))); if (d >= s) yield d; mo += N; y += Math.floor(mo / 12); mo %= 12; }
  }
  if (t.type === 'yearly') {
    let y = ymd(s)[0]; const mo = (t.month || 1) - 1;
    for (;;) { const d = ds(new Date(y, mo, Math.min(t.monthDay || 1, dim(y, mo)))); if (d >= s) yield d; y += N; }
  }
}

function runFixed(t, end, stopAt) {
  const key = `F${t.id}|${end}|${stopAt || ''}`; if (MEMO[key]) return MEMO[key];
  const P = activePeople(t), n = P.length, out = [];
  const rot = t.rot || { from: t.start, idx: 0, credits: [] };
  const comps = {}; for (const c of CI[t.id] || []) comps[c.date] = c;
  let p = rot.idx || 0; const credits = (rot.credits || []).map(c => ({ ...c }));
  const resolve = d => { for (let g = 0; g < n; g++) { const u = P[p % n]; const i = credits.findIndex(c => c.uid === u && c.from < d); if (i < 0) break; credits.splice(i, 1); p++; } return P[p % n]; };
  let guard = 0;
  if (n) for (const d of occIter(t)) {
    if (d > end || ++guard > 20000) break;
    if (stopAt && d >= stopAt) break;
    const c = comps[d];
    const e = occEnd(t, d);
    if (d < (rot.from || '')) { if (c) out.push({ date: d, end: e, assignee: c.assignee, done: c }); continue; }
    const a = resolve(d);
    if (c) {
      const who = c.assignee || a;
      if (c.skipped || c.by === who) p++;
      else { credits.push({ uid: c.by, from: c.doneDay }); if (c.doneDay > e) p++; }
      out.push({ date: d, end: e, assignee: who, done: c });
    } else { p++; out.push({ date: d, end: e, assignee: a, done: null }); }
  }
  return (MEMO[key] = { out, idx: n ? p % n : 0, credits });
}

function runSeq(t, stopAt) {
  const key = `S${t.id}|${stopAt || ''}`; if (MEMO[key]) return MEMO[key];
  const P = activePeople(t), n = P.length; if (!n) return (MEMO[key] = null);
  const rot = t.rot || { from: '0000-00-00', idx: 0, credits: [] };
  const comps = (CI[t.id] || []).filter(c => c.date >= (rot.from || '') && (!rot.at || c.at > rot.at) && (!stopAt || c.date < stopAt)).sort((a, b) => a.at - b.at);
  let p = rot.idx || 0; const credits = [...(rot.credits || [])];
  const resolve = () => { for (let g = 0; g < n; g++) { const i = credits.indexOf(P[p % n]); if (i < 0) break; credits.splice(i, 1); p++; } return P[p % n]; };
  for (const c of comps) { const a = resolve(); const who = c.assignee || a; if (c.skipped || c.by === who) p++; else credits.push(c.by); }
  const state = { idx: p % n, credits: [...credits] };
  const next = []; for (let i = 0; i < 40; i++) { next.push(resolve()); p++; }
  const lastDone = comps.length ? comps.at(-1).doneDay : (rot.lastDone || null);
  return (MEMO[key] = { comps, next, lastDone, ...state });
}

function buildAgenda(from, to) {
  const T = today(), map = {}, overdue = [], windows = [], winAll = [], key = `A${from}|${to}`;
  if (MEMO[key]) return MEMO[key];
  const push = (d, it) => (map[d] ||= []).push(it);
  for (const [id, t0] of Object.entries(S.tasks)) {
    const t = { id, ...t0 }; if (t.paused) continue;
    if (FIXED.includes(t.type)) {
      if (isWin(t)) {
        for (const o of runFixed(t, to > T ? to : T).out) {
          const it = { t, date: o.date, end: o.end, assignee: o.assignee, done: o.done, kind: 'window' };
          const at = o.done ? o.done.doneDay : o.end;
          if (at >= from && at <= to) push(at, it);
          if (!o.done && o.date <= T && o.end >= T) windows.push(it);
          if (!o.done && o.end >= from && o.date <= to && o.end >= T) winAll.push(it);
          if (!o.done && o.end < T && o.end >= addDays(T, -30)) overdue.push({ ...it, overdue: true, due: o.end });
        }
        continue;
      }
      for (const o of runFixed(t, to > T ? to : T).out) {
        const it = { t, date: o.date, assignee: o.assignee, done: o.done, kind: 'fixed' };
        if (o.date >= from && o.date <= to) push(o.date, it);
        if (!o.done && o.date < T && o.date >= addDays(T, -30)) overdue.push({ ...it, overdue: true });
      }
    } else {
      const r = runSeq(t); if (!r) continue;
      for (const c of r.comps) if (c.date >= from && c.date <= to) push(c.date, { t, date: c.date, assignee: c.assignee, done: c, kind: t.type });
      if (t.type === 'ondone') { if (T >= from && T <= to) push(T, { t, date: T, assignee: r.next[0], done: null, kind: 'ondone' }); }
      else {
        const X = Math.max(1, t.after || 1);
        const due = r.lastDone ? addDays(r.lastDone, X) : (t.start || T);
        const base = due < T ? T : due;
        r.next.forEach((a, i) => {
          const d = addDays(base, i * X); if (d > to) return;
          const it = { t, date: d, assignee: a, done: null, kind: 'afterdone', predicted: i > 0 };
          if (i === 0 && due < T) { overdue.push({ ...it, overdue: true, due }); }
          else if (d >= from) push(d, it);
        });
      }
    }
  }
  overdue.sort((a, b) => (a.due || a.date).localeCompare(b.due || b.date));
  windows.sort((a, b) => a.end.localeCompare(b.end));
  return (MEMO[key] = { map, overdue, windows, winAll });
}

function compact() { // mantiene pocas "completadas" cargadas: guarda el estado de la rotación cada cierto tiempo
  const T = today(), lim = addDays(T, -45), X = addDays(T, -30);
  for (const [id, t0] of Object.entries(S.tasks)) {
    const t = { id, ...t0 }; const from = t.rot?.from || t.start || T;
    if (from >= lim) continue;
    let rot;
    if (FIXED.includes(t.type)) { const s = runFixed(t, X, X); rot = { from: X, idx: s.idx, credits: s.credits }; }
    else { const s = runSeq(t, X); if (!s) continue; rot = { from: X, idx: s.idx, credits: s.credits, lastDone: s.lastDone || null }; }
    W(store.update('tasks', id, { rot }));
  }
}

function currentAssignee(t, includeDone) {
  if (FIXED.includes(t.type)) { const T = today(); const o = runFixed(t, addDays(T, 800)).out.find(o => (o.end || o.date) >= T && (includeDone || !o.done)); return o?.assignee; }
  return runSeq(t)?.next[0];
}

function describe(t) {
  const N = Math.max(1, t.every || 1);
  switch (t.type) {
    case 'daily': return N === 1 ? 'Todos los días' : `Cada ${N} días`;
    case 'weekly': if (isWin(t)) return (N === 1 ? 'Cada semana' : `Cada ${N} semanas`) + ', cualquier día';
    { const d = (t.weekdays || []).slice().sort().map(i => DAB[i]).join(', '); return (N === 1 ? 'Cada semana' : `Cada ${N} semanas`) + (d ? `: ${d}` : ''); }
    case 'monthly': if (isWin(t)) return (N === 1 ? 'Cada mes' : `Cada ${N} meses`) + ', cualquier día';
      return (N === 1 ? 'Cada mes' : `Cada ${N} meses`) + `, día ${t.monthDay || 1}`;
    case 'yearly': return (N === 1 ? 'Cada año' : `Cada ${N} años`) + `, ${t.monthDay || 1} de ${MESES[(t.month || 1) - 1]}`;
    case 'ondone': return 'Al terminar pasa al siguiente';
    case 'afterdone': { const X = Math.max(1, t.after || 1); return X === 1 ? 'Vuelve 1 día después de hacerla' : `Vuelve ${X} días después de hacerla`; }
  }
  return '';
}

function applyTheme(p) {
  p = p || JSON.parse(localStorage.getItem('hogar-theme') || '{}');
  const th = p.theme || 'dark';
  const real = th === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : th;
  document.documentElement.dataset.theme = real;
  document.documentElement.style.setProperty('--accent', ACCENTS[p.accent] || ACCENTS.naranja);
  $('meta[name=theme-color]').content = real === 'light' ? '#f3f3f6' : '#0f0f10';
  localStorage.setItem('hogar-theme', JSON.stringify({ theme: th, accent: p.accent || 'naranja' }));

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function paint(el, html) {
  const a = document.activeElement; let keep = null;
  if (a && el.contains(a) && a.id) keep = { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  const scroller = el.querySelector('.sheet'); const st = scroller?.scrollTop;
  el.innerHTML = html;
  if (st && el.querySelector('.sheet')) el.querySelector('.sheet').scrollTop = st;
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.focus({ preventScroll: true }); try { n.setSelectionRange(keep.s, keep.e); } catch { } } }
}

async function boot() {
  applyTheme(); showLoader();
  if (DEMO) {
    store = new LocalStore();
    const u = JSON.parse(localStorage.getItem('hogar-demo-user') || 'null');
    u ? signedIn(u) : showLogin();
  } else {
    store = new FireStore();
    try { await store.init(FIREBASE_CONFIG); }
    catch (e) { console.error(e); return paint($('#app'), `<div class="login"><div class="logo">⚠️</div><p>No se pudo conectar con Firebase.<br><span class="muted small">${esc(e.message)}</span></p></div>`); }
    store.onAuth(u => u ? signedIn({ uid: u.uid, name: u.displayName || u.email, email: u.email, photo: u.photoURL }) : (stopApp(), showLogin()));
  }
}

async function createProfile(user) { // primera vez que entra esta cuenta
  try {
    const base = { name: user.name || 'Sin nombre', email: user.email || '', photo: user.photo || '', theme: 'dark', accent: 'naranja', createdAt: Date.now() };
    let founder = false;
    if (!(await store.get('meta', 'group'))) { try { await store.set('meta', 'group', { founder: user.uid, at: Date.now() }); founder = true; } catch { } }
    await store.set('users', user.uid, founder ? { ...base, status: 'approved', role: 'admin', color: 0 } : { ...base, status: 'pending', role: 'member', color: null });
  } catch (e) { console.error(e); toast('Error al entrar: ' + (e.code || e.message)); }
}
function signedIn(user) {
  S.me = user; showLoader('Entrando…');
  let had = false, creating = false;
  // El perfil sale al instante de la caché del móvil; solo se pregunta al servidor si no está guardado.
  unsubs.push(store.watchDoc('users', user.uid, async (p, fromCache) => {
    if (!p) {
      if (fromCache) return;
      if (had) { S.profile = null; stopApp(); return showWaiting(null); }
      if (!creating) { creating = true; await createProfile(user); }

let dataUnsubs = [];

  dataUnsubs = [

const fUid = () => UI.filter === 'me' ? S.me.uid : UI.filter;
const matchF = it => UI.filter === 'all' || it.assignee === fUid() || it.done?.by === fUid();
function filterChips() {

  </div>`;
}
function ring(items, d, size = 46) {
  const T = today(), f = items.filter(matchF), tot = f.length, done = f.filter(i => i.done).length;
  const r = 17, C = 2 * Math.PI * r;
  let arc = '';
  if (tot && done) arc = `<circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--green)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C * done / tot} ${C}" transform="rotate(-90 22 22)"/>`;
  const missed = d < T && tot > done;
  return `<div class="ringw"><svg width="${size}" height="${size}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="${missed ? 'color-mix(in srgb,var(--red) 45%,var(--line))' : 'var(--line)'}" stroke-width="3.5"/>${arc}</svg>
    <span class="num">${pd(d).getDate()}</span></div><div class="dots">${[...new Set(f.filter(i => !i.done).map(i => i.assignee))].slice(0, 4).map(u => `<i style="background:${pcolor(u)}"></i>`).join('')}</div>`;
}
let ITEMS = [];
function taskRow(it, ro) {
  const k = ITEMS.push(it) - 1, T = today(), mine = it.assignee === S.me.uid;
  let su;
  if (it.done) su = it.done.skipped ? 'Omitida' : `Hecha por ${it.done.by === S.me.uid ? 'ti' : shortN(it.done.by)}${it.done.by !== it.assignee ? ` (le tocaba a ${short(it.assignee)})` : ''}`;

  else if (it.kind === 'window') { const left = diffDays(T, it.end); su = `${it.date > T ? 'Previsto · ' : ''}${left === 0 ? 'Último día' : left < 0 ? '' : `Quedan ${left + 1} días`} · ${mine ? 'te toca a ti' : 'le toca a ' + shortN(it.assignee)}`; }
  else if (it.kind === 'ondone') su = `${mine ? 'Te toca a ti' : 'Le toca a ' + shortN(it.assignee)} · pasa al terminar`;
  else su = (it.date > T ? (it.predicted ? 'Previsto · ' : '') : '') + (mine ? 'Te toca a ti' : 'Le toca a ' + shortN(it.assignee));
  const canCheck = !ro && (it.done ? it.done.doneDay === T : it.date <= addDays(T, 60));
  if (ro) su = (mine ? 'Te tocará a ti' : 'Le tocará a ' + shortN(it.assignee));

}
function dayDetail(d, ag) {
  const T = today();
  const items = (ag.map[d] || []).filter(matchF);
  const pendingFirst = (a, b) => (!!a.done - !!b.done) || a.t.name.localeCompare(b.t.name);
  let h = '';
  if (d === T) {
    const over = ag.overdue.filter(matchF);
    if (over.length) h += `<div class="h2 red">Atrasadas <span class="n">${over.length}</span></div>` + over.map(i => taskRow(i)).join('');
    const pend = items.filter(i => !i.done && i.kind !== 'ondone' && i.kind !== 'window'), turns = items.filter(i => !i.done && i.kind === 'ondone'), done = items.filter(i => i.done);
    const wins = (ag.windows || []).filter(matchF);
    if (wins.length) h += `<div class="h2">Con plazo <span class="n">${wins.length}</span></div>` + wins.map(i => taskRow(i)).join('');
    if (pend.length) h += `<div class="h2">Para hoy <span class="n">${pend.length}</span></div>` + pend.sort(pendingFirst).map(i => taskRow(i)).join('');
    if (turns.length) h += `<div class="h2">Cuando haga falta <span class="n">${turns.length}</span></div>` + turns.sort(pendingFirst).map(i => taskRow(i)).join('');
    if (done.length) h += `<div class="h2">Hechas hoy <span class="n">${done.length}</span></div>` + done.map(i => taskRow(i)).join('');
    if (!h) h = `<div class="empty"><div class="big">🎉</div>Nada pendiente para hoy</div>`;
  } else {
    const its = items.filter(i => i.done || i.kind !== 'window');
    const wins = (ag.winAll || []).filter(w => w.date <= d && w.end >= d).filter(matchF);
    if (its.length) h += `<div class="h2">${esc(relDay(d))} <span class="n">${its.length}</span></div>` + its.sort(pendingFirst).map(i => taskRow(i)).join('');
    if (wins.length) h += `<div class="h2">Con plazo esa ${wins.some(w => w.t.type === 'monthly') ? 'época' : 'semana'} <span class="n">${wins.length}</span></div>` + wins.map(i => taskRow(i)).join('');
    if (!h) h = `<div class="empty"><div class="big">☕</div>Nada para este día</div>`;

  return h;
}

function compraData() {
  const T = today(), N = UI.compraN, agg = {}, noIng = new Set();
  for (let i = 1; i <= N; i++) {
    const d = addDays(T, i), dm = dayMenu(d); if (!dm) continue;
    for (const [mk, ml] of MEALS) for (const [ck] of COURSES) {
      const dish = S.dishes[dm.slots[mk]?.[ck]]; if (!dish) continue;
      if (!(dish.ingredients || []).length) noIng.add(dish.name);
      for (const ing of dish.ingredients || []) {
        const key = norm(ing.name) + '|' + ing.unit;
        const a = (agg[key] ||= { key, name: ing.name.trim(), unit: ing.unit, total: 0, parts: [] });
        a.total += Number(ing.amount) || 0;
        a.parts.push({ dish: dish.name, d, meal: ml, amount: Number(ing.amount) || 0 });

}

let sheet = null;
function dragToClose(el) { // deslizar hacia abajo para cerrar
  let y0 = null, dy = 0, on = false;
  const reset = () => { el.style.transition = 'transform .18s'; el.style.transform = ''; };
  el.addEventListener('touchstart', e => { y0 = el.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; on = false; el.style.transition = ''; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0 && el.scrollTop <= 0) { on = true; e.preventDefault(); el.style.transform = `translateY(${dy}px)`; }
    else if (!on) y0 = null;
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (on) { if (dy > 110) { el.style.transition = 'transform .18s'; el.style.transform = 'translateY(100%)'; setTimeout(closeSheet, 170); } else reset(); }
    y0 = null; on = false;
  });
}

  if (!st.people.length) return toast('Elige al menos una persona');
  if (st.type === 'weekly' && st.mode !== 'window' && !st.weekdays.length) return toast('Elige algún día de la semana');
  const data = { mode: st.mode || 'days', name, emoji: st.emoji, type: st.type, every: st.every, weekdays: [...st.weekdays].sort((a, b) => a - b), monthDay: Number(st.monthDay), month: Number(st.month), after: st.after, start: st.start || T, paused: !!st.paused };
  if (!st.id) {
    const people = shuffle(st.people);
    const rot = FIXED.includes(st.type) ? { from: firstOpen(data, T), idx: 0, credits: [] } : { from: T, idx: 0, credits: [], lastDone: null };
    put('tasks', { ...data, people, rot, createdAt: Date.now(), createdBy: S.me.uid });
    toast('Tarea creada · orden: ' + people.map(shortN).join(' → '));
  } else {
    const old = { id: st.id, ...S.tasks[st.id] };
    const kept = activePeople(old).filter(u => st.people.includes(u));
    const people = [...kept, ...shuffle(st.people.filter(u => !kept.includes(u)))];
    const sched = ['mode', 'type', 'every', 'weekdays', 'monthDay', 'month', 'after', 'start'];
    const changed = JSON.stringify(people) !== JSON.stringify(activePeople(old)) || sched.some(k => JSON.stringify(data[k]) !== JSON.stringify(old[k]));
    const patch = { ...data, people };
    if (changed) {
      const cur = old.paused ? null : currentAssignee(old, true);
      const idx = Math.max(0, people.indexOf(cur));
      const sq = !FIXED.includes(old.type) ? runSeq(old) : null;
      patch.rot = FIXED.includes(data.type) ? { from: firstOpen(data, T), idx, credits: [] } : { from: T, at: Date.now(), idx, credits: [], lastDone: sq?.lastDone || null };
    }
    W(store.update('tasks', st.id, patch));
    toast('Tarea guardada');
  }
  closeSheet();
}

function itemSheet(st) {
  const it = st.it, T = today(), me = S.me.uid, mine = it.assignee === me, t = it.t;
  const P = activePeople(t);
  let h = shead(t.name, it.kind === 'ondone' ? 'Turno actual' : it.kind === 'window' ? `${it.overdue ? 'Atrasada · ' : ''}Plazo: del ${fmtShort(it.date).toLowerCase()} al ${fmtShort(it.end).toLowerCase()}` : (it.overdue ? 'Atrasada · ' : '') + cap(fmtLong(it.due || it.date)), t.emoji);
  h += `<div class="card" style="margin-top:6px"><div style="display:flex;align-items:center;gap:10px">${av(it.assignee)}<div><b>${mine ? 'Te toca a ti' : 'Le toca a ' + esc(pname(it.assignee))}</b><div class="muted small">${esc(describe(t))}</div></div></div>
    <div class="order" style="margin-top:12px">Orden: ${P.map((u, i) => `${i ? '→' : ''}${av(u, 'sm')}`).join('')}</div>
    ${it.done ? `<div class="note">${it.done.skipped ? 'Se omitió' : `Hecha por ${esc(pname(it.done.by))}`} el ${esc(fmtLong(it.done.doneDay))}.</div>` : ''}</div>
    <div class="actions">`;
  if (it.done) {
    if (it.done.doneDay === T) h += `<button class="btn ghost full" data-act="undo">↩︎ Deshacer</button>`;
    else h += `<div class="note">Solo se puede deshacer el mismo día.</div>`;
  } else {
    if (it.predicted) h += `<div class="note">Es una previsión: la fecha depende de cuándo se haga la anterior.</div>`;
    else {
      h += mine ? `<button class="btn full" data-act="complete">✓ Hecha</button>`
        : `<button class="btn full" data-act="complete">✓ La he hecho yo</button><div class="note">Le seguirá tocando a ${esc(shortN(it.assignee))} la próxima vez, y a ti se te saltará tu próximo turno.</div>`;
      if (it.overdue || it.kind !== 'fixed' || it.date <= T) h += `<button class="btn ghost full" data-act="skipTask">Omitir esta vez</button>`;
    }
  }
  h += `<button class="btn ghost full" data-act="editTask" data-id="${t.id}">Editar tarea</button></div>`;
  return h + taskHistory(t.id);
}
function taskHistory(id) {
  const list = (CI[id] || []).slice().sort((a, b) => b.at - a.at).slice(0, 15);
  if (!list.length) return `<div class="lbl">Historial</div><div class="muted small">Todavía no se ha hecho ninguna vez.</div>`;
  return `<div class="lbl">Historial</div><div>${list.map(c => `<div class="hist">${av(c.skipped ? c.assignee : c.by, 'sm')}<span style="flex:1">${c.skipped ? `Omitida (le tocaba a ${esc(shortN(c.assignee))})` : `${esc(shortN(c.by))}${c.by !== c.assignee ? ` <span class="muted">en lugar de ${esc(shortN(c.assignee))}</span>` : ''}`}</span><span class="muted small">${esc(fmtShort(c.doneDay))} ${new Date(c.at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('')}</div>`;
}
function complete(it, skipped) {
  const T = today(), me = S.me.uid;
  const dated = it.kind === 'fixed' || it.kind === 'window';
  const doc = { taskId: it.t.id, date: dated ? it.date : T, doneDay: T, by: me, assignee: it.assignee, at: Date.now() };
  if (skipped) doc.skipped = true;
  if (dated) W(store.set('completions', `${it.t.id}_${it.date}`, doc)); else put('completions', doc);
  if (!skipped) toast(it.assignee === me ? '¡Hecha! ✓' : `Hecha por ti en lugar de ${shortN(it.assignee)}`);
}

function dishSheet(st) {

  let h = shead(st.id ? 'Editar plato' : 'Nuevo plato', null, null, st.id ? 'dDelete' : null);

    <div class="lbl">Ingredientes</div>

function openDish(id, after) {
  const d = id ? S.dishes[id] : null;
  const ings = (d?.ingredients || []).map(i => { const [q, u] = toEdit(Number(i.amount) || 0, i.unit); return { name: i.name, qty: q ? String(+q.toFixed(3)) : '', unit: u }; });
  if (!ings.length) ings.push({ name: '', qty: '', unit: 'g' });
  openSheet(dishSheet, { id, name: d?.name || '', ings, after });
}

function pickSheet(st) {
  const q = norm(st.q);
  const list = Object.entries(S.dishes).map(([id, d]) => ({ id, ...d })).filter(d => !q || norm(d.name).includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  const cur = st.cur;
  let h = shead('Elegir plato', `Semana ${st.w + 1} · ${cap(DIAS[st.d])} · ${st.m === 'comida' ? 'Comida' : 'Cena'} · ${st.c === 'primero' ? 'Primero' : 'Segundo'}`);
  h += `<input id="pq" data-bind="q" data-live="1" value="${sv('q')}" placeholder="Buscar o escribir uno nuevo…" autocomplete="off" style="margin-top:8px">
    <div style="margin-top:8px">${list.map(d => `<button class="pp ${cur === d.id ? 'on' : ''}" data-act="pick" data-id="${d.id}"><span style="font-size:20px">🍽️</span><span class="nm">${esc(d.name)}</span>${cur === d.id ? '<span class="ord">✓</span>' : ''}</button>`).join('')}</div>
    ${st.q && !list.some(d => norm(d.name) === q) ? `<button class="btn ghost full" style="margin-top:8px" data-act="pickNew">＋ Crear «${esc(st.q.trim())}»</button>` : ''}
    <div class="actions">${cur ? `<button class="btn danger full" data-act="pick" data-id="">Dejar vacío</button>` : ''}</div>`;
  return h;
}
function setSlot(w, d, m, c, id) {
  const p = clone(plan()); if (!p.weeks?.[w]) return;
  p.weeks[w].days[d][m][c] = id || null;
  W(store.set('menu', 'plan', p));
}

  },
  demoSwitch: d => { const u = S.users[d.id]; if (!u || d.id === S.me.uid) return; const nu = { uid: d.id, name: u.name, email: u.email, photo: u.photo }; localStorage.setItem('hogar-demo-user', JSON.stringify(nu)); location.hash = '#/tareas/hoy'; location.reload(); },
  demoWipe: () => { if (!confirm('¿Borrar todos los datos de prueba?')) return; store.wipe(); location.reload(); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && sheet) {
    const path = el.dataset.bind.split('.'); let o = sheet.st;
    for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path.at(-1)] = el.dataset.num ? Number(el.value) : el.value;
    if (el.dataset.live) renderSheet();
  } else if (el.id) { UI.inputs[el.id] = el.value; if (el.dataset.live) scheduleRender(); }
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && ACT[el.dataset.change]) ACT[el.dataset.change](el.dataset, el, e); });
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key !== 'Enter' || !el.dataset?.enter) return;
  e.preventDefault(); if (el.id) UI.inputs[el.id] = el.value; ACT[el.dataset.enter]?.(el.dataset, el, e);
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => applyTheme(S.profile));
setInterval(() => { if (S.started) { MEMO = {}; maintainLists(); scheduleRender(); } }, 60000); // cambia de día, caducan listas…
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.started) { MEMO = {}; scheduleRender(); } });

boot();
</script>
</body>
</html>
